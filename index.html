<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10294f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-v3-192.png">
<link rel="apple-touch-icon" href="icon-v3-180.png">
<title>שניים מקרא ואחד תרגום</title>
<style>
@font-face{font-family:"TanachFont";src:url(font.woff2) format("woff2");font-weight:100 900;font-stretch:62% 100%;font-display:swap}
@font-face{font-family:"UIFont";src:url(font-ui.woff2) format("woff2");font-weight:100 900;font-display:swap}
:root{--bg:#f4efe4;--card:#fffdf8;--ink:#23262d;--mute:#6d6a62;--accent:#14305a;--ok:#22875a;--line:#e6dec9;--mark:#fff1b8;--fs:26px;
 --hld:#fde2a0;--hlz:#c6ecd6;--bmc:#9b2c3d;--bmbg:rgba(155,44,61,.10);--bmflash:rgba(155,44,61,.32);--c1:#b4572b;--c2:#1b7f8c;--c3:#6a3fa0;--gold:#d9a441;--hero1:#0f2750;--hero2:#1b5e86;--hero3:#1b8a94}
[data-theme=dark]{--bmc:#e57a8e;--bmbg:rgba(229,122,142,.14);--bmflash:rgba(229,122,142,.38);--bg:#12161c;--card:#1b2029;--ink:#e9e5da;--mute:#9b978c;--accent:#9cc0f0;--ok:#5fc287;--line:#2b323d;--mark:#4a4220;--hld:#5a4a1a;--hlz:#1f5a3d;--c1:#e08a5c;--c2:#52b8c4;--c3:#b394e6}
[data-theme=sepia]{--bmc:#8a2c1d;--bmbg:rgba(138,44,29,.12);--bmflash:rgba(138,44,29,.34);--bg:#efe2c3;--card:#f8edd3;--ink:#3b2f1a;--mute:#7a6a4a;--accent:#6b3f1d;--ok:#3d7a43;--line:#d8c79d;--mark:#f3d982;--hld:#f4cf7a;--hlz:#bfe0c0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"UIFont",system-ui,"Segoe UI",Arial,sans-serif;font-size:17px}
button,select,input{font:inherit;color:inherit}button{cursor:pointer}
svg{width:1.15em;height:1.15em;vertical-align:-.2em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#app{max-width:720px;margin:0 auto;padding:0 14px calc(104px + env(safe-area-inset-bottom))}
/* hero */
.hero{margin:0 -14px;padding:calc(22px + env(safe-area-inset-top)) 18px 70px;text-align:center;color:#fff;border-radius:0 0 34px 34px;
 background:radial-gradient(circle at 15% 10%,rgba(217,164,65,.35),transparent 45%),radial-gradient(circle at 90% 90%,rgba(255,255,255,.12),transparent 40%),linear-gradient(160deg,var(--hero1),var(--hero2) 60%,var(--hero3))}
.hero h1{margin:16px 0 2px;font-size:38px;font-weight:800;letter-spacing:.5px}
.hero h1 b{color:var(--gold)}
.hero p{margin:0;opacity:.9;font-size:15px}
.htop{display:flex;align-items:center;justify-content:space-between;gap:12px}
.hded{display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 12px;border:1px solid rgba(217,164,65,.55);border-radius:14px;background:rgba(255,255,255,.08);text-align:center}
.hded div{line-height:1.25}
.hded i{width:26px;height:1px;background:var(--gold);opacity:.8}
.hded small{display:block;color:var(--gold);font-size:10.5px;font-weight:700;letter-spacing:.6px}
.hded b{display:block;font-size:13px;font-weight:700;color:#fff}
.orn{display:flex;align-items:center;gap:10px;justify-content:center;color:var(--gold);margin:10px auto 0;max-width:260px}
.orn:before,.orn:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
.orn:after{transform:scaleX(-1)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin:14px 0;box-shadow:0 2px 10px rgba(20,48,90,.06)}
.datecard{margin-top:-46px;text-align:center;position:relative;padding:18px 12px 16px}
.datecard .he{font-size:30px;font-weight:800;color:var(--accent);line-height:1.2}
.datecard .gr{font-size:17px;color:var(--mute);margin-top:4px}
.chip{display:inline-block;margin-top:10px;background:linear-gradient(90deg,var(--c2),var(--c3));color:#fff;border-radius:999px;padding:4px 14px;font-size:14px;font-weight:600}
.strip{display:flex;gap:6px;margin-top:12px}
.dy{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:7px 0 8px;font-size:13px;color:var(--mute);line-height:1.2;font-weight:600}
.dy b{display:block;font-size:17px;color:var(--ink);margin-top:2px;font-weight:800}
.dy.sel{background:var(--accent);border-color:var(--accent);color:#cfe0f5}.dy.sel b{color:#fff}
.dy.today{box-shadow:inset 0 -4px 0 var(--gold)}
.dy:disabled{opacity:.35;cursor:default}
.weeknav{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:10px}
.weeknav button{border:0;background:none;color:var(--accent);font-weight:800;font-size:15px;padding:8px 4px}
.weeknav .td{border:2px solid var(--accent);border-radius:999px;padding:6px 22px;background:none;color:var(--accent)}
.weeknav .td.on{background:var(--accent);color:var(--card);box-shadow:0 3px 10px rgba(20,48,90,.3)}
.swrow{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:12px;font-size:13px;color:var(--mute);font-weight:600}
.sg{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px;color:var(--ink)}
.sg.on{background:var(--accent);border-color:var(--accent);color:var(--card)}
.nav{display:flex;gap:8px;margin-top:14px;justify-content:center;flex-wrap:wrap}
.nav button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:9px 18px;font-weight:600}
.nav button.p{background:var(--accent);color:var(--card);border-color:var(--accent)}
/* chapter cards */
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:700;white-space:nowrap}
.btn.read{background:linear-gradient(135deg,var(--hero1),var(--hero2) 65%,var(--hero3));color:#fff;font-size:18px;font-weight:800;padding:8px 18px 8px 12px;display:flex;align-items:center;gap:9px;box-shadow:0 5px 14px rgba(16,41,80,.35)}
.btn.read .ic{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;flex:none}
.btn.read .ic svg{width:20px;height:20px;stroke-width:2.2}
.btn.read:active{transform:scale(.97)}
.btn.chk{background:var(--bg);border:2px solid var(--line);color:var(--mute)}
.btn.chk.on{background:var(--ok);border-color:var(--ok);color:#fff}
.banner{background:var(--mark);border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:10px;margin:14px 0}
.banner.col{flex-direction:column;align-items:stretch}
.banner .bb{display:flex;gap:8px;flex-wrap:wrap}
.banner .bb button{margin:0;flex:1;min-width:130px}
.banner button{margin-inline-start:auto;border:0;background:var(--accent);color:var(--card);border-radius:10px;padding:9px 14px;font-weight:700;white-space:nowrap}
.ring{--p:0;width:74px;height:74px;border-radius:50%;background:conic-gradient(var(--ok) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;flex:none}
.ring i{width:56px;height:56px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-style:normal;font-weight:800;font-size:16px}
.prog{display:flex;align-items:center;gap:14px}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
h3.sh{margin:0 0 10px;font-size:19px;color:var(--accent);display:flex;align-items:center;gap:8px}
.lbl{font-size:13px;font-weight:700;color:var(--mute);margin:10px 2px 4px}
select{width:100%;height:46px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:0 10px;font-size:17px;color:var(--ink)}
.tabs{position:fixed;bottom:0;inset-inline:0;background:var(--card);border-top:1px solid var(--line);display:flex;gap:8px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));z-index:6;box-shadow:0 -4px 16px rgba(0,0,0,.06)}
.tabs button{flex:1;border:0;border-radius:14px;background:none;padding:8px 4px;font-size:14px;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs svg{width:24px;height:24px}
.tabs button.on{color:var(--accent);font-weight:800}
.tabs button.hl{background:linear-gradient(135deg,#1b5e86,#1b8a94);color:#fff;font-weight:800;box-shadow:0 5px 14px rgba(27,94,134,.5);position:relative}
.tabs button.hl i{position:absolute;top:-9px;left:10px;background:var(--gold);color:#14305a;border-radius:999px;font-style:normal;font-size:12px;font-weight:800;padding:1px 8px}
/* footer */
.ft{text-align:center;margin:30px 0 8px;color:var(--mute)}
.ft .ded{margin:10px auto;padding:12px 10px;max-width:380px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.ft .ded small{display:block;color:var(--gold);letter-spacing:1px;font-size:13px;font-weight:700}
.ft .ded b{display:block;color:var(--accent);font-size:17px;font-weight:700;margin:1px 0 6px}
.ft .ded b:last-child{margin-bottom:0}
.ft .cp{font-size:12px;opacity:.85}
.ft .src{font-size:11px;opacity:.75;margin-top:6px;line-height:1.5}
.ft .src a{color:inherit;text-decoration:underline}
/* reader */
.rh{position:sticky;top:0;z-index:5;margin:0 -14px;padding:calc(8px + env(safe-area-inset-top)) 12px 10px;display:flex;align-items:center;gap:10px;color:#fff;background:linear-gradient(160deg,var(--hero1),var(--hero2) 70%,var(--hero3));box-shadow:0 4px 14px rgba(0,0,0,.2)}
.rh .home{display:flex;align-items:center;gap:6px;border:0;background:#fff;color:#10294f;font-weight:800;border-radius:999px;padding:9px 14px;box-shadow:0 2px 6px rgba(0,0,0,.25);white-space:nowrap}
.rh .rt{flex:1;text-align:center;font-weight:800;font-size:19px}
.rh .gear{border:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.14);color:#fff;border-radius:12px;height:42px;min-width:46px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:4px;padding:0 10px}
.text{font-family:"TanachFont","Noto Serif Hebrew","Ezra SIL","SBL Hebrew","Times New Roman",serif;font-size:var(--fs);line-height:2.2;text-align:right;hyphens:none;margin-top:8px}
.rbar{position:fixed;bottom:0;inset-inline:0;background:var(--card);border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom));display:flex;gap:8px;align-items:stretch;z-index:6;box-shadow:0 -4px 16px rgba(0,0,0,.08)}
.rbar button{border:1px solid var(--line);background:var(--bg);border-radius:14px;min-height:50px;padding:4px 10px;font-weight:700;line-height:1.15;flex:1}
.rbar button small{display:block;font-weight:500;font-size:12px;color:var(--mute)}
.rbar .next{background:var(--accent);color:var(--card);border-color:var(--accent)}
.rbar .next small{color:inherit;opacity:.85}
.rbar .learn{flex:1.2;background:var(--card);color:var(--ok);border:2px solid var(--ok)}
.rbar .learn.on{background:var(--ok);color:#fff}
/* sheets */
.ov{position:fixed;inset:0;background:rgba(10,18,34,.55);z-index:30;display:none;align-items:flex-end;justify-content:center}
.ov.show{display:flex}
.sheet{overscroll-behavior:contain;background:var(--card);width:100%;max-width:720px;max-height:78vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet .x{float:left;border:0;background:var(--bg);width:38px;height:38px;border-radius:50%;font-size:18px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-of-type{border:0}
.seg{display:flex;gap:6px}
.seg button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 12px;font-weight:700}
.seg button.on{background:var(--accent);color:var(--card);border-color:var(--accent)}
.themes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:100%}
.themes button{border:2px solid var(--line);border-radius:14px;padding:10px 4px;font-size:15px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--bg)}
.themes button.on{border-color:var(--accent)}
.themes i{width:34px;height:22px;border-radius:6px;border:1px solid rgba(0,0,0,.2)}
.sw{width:52px;height:30px;border-radius:999px;border:0;background:var(--line);position:relative;flex:none}
.sw:after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw.on{background:var(--ok)}.sw.on:after{inset-inline-start:25px}
.toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:999px;z-index:40;font-size:15px;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:.95}
.toast button{margin-inline-start:14px;border:0;background:#fff;color:#14305a;border-radius:999px;padding:6px 14px;font-weight:800}
:root{--tg:#e4f2f4;--tgb:#1b7f8c}
[data-theme=dark]{--tg:#1a2c31;--tgb:#52b8c4}
[data-theme=sepia]{--tg:#e9dfba;--tgb:#1b6f6a}
.hero h1{font-size:32px;line-height:1.25}
.chip.hol{background:linear-gradient(90deg,#b4572b,#d9a441)}
.strip .dy{position:relative}
.dy .ck{position:absolute;top:3px;inset-inline-end:5px;font-style:normal;font-size:11px;color:var(--ok);font-weight:800}
.dy.sel .ck{color:#bff0d3}
.dy small{display:block;font-size:10.5px;font-weight:600;opacity:.8;margin-top:1px}
/* כרטיס עלייה */
.al{padding:16px 18px 16px 14px;position:relative;overflow:hidden;display:flex;align-items:center;gap:12px}
.al:before{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:9px;background:linear-gradient(180deg,var(--hero1),var(--hero2) 60%,var(--hero3))}
.al .t{flex:1;min-width:0;padding-inline-start:8px}
.al .t small{color:var(--c2);font-weight:800;font-size:14px}
.al .t b{display:block;font-size:24px;line-height:1.25;margin:1px 0}
.al .t span{font-size:14px;color:var(--mute)}
.al .btns{display:flex;flex-direction:column;gap:8px}
.al.done .t b{color:var(--ok)}
.wl{display:flex;align-items:center;gap:10px;width:100%;text-align:right;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 4px}
.wl:last-child{border:0}
.wl .n{flex:none;width:34px;height:34px;border-radius:50%;background:var(--bg);border:1px solid var(--line);display:grid;place-items:center;font-weight:800;color:var(--accent)}
.wl .x1{flex:1;min-width:0}
.wl .x1 b{display:block;font-size:16px}
.wl .x1 span{font-size:13px;color:var(--mute)}
.wl.sel .n{background:var(--accent);color:var(--card);border-color:var(--accent)}
.wl.done .n{background:var(--ok);border-color:var(--ok);color:#fff}
.wl .go{flex:none;color:var(--mute)}
.tot{display:flex;gap:10px;margin-top:12px}
.tot div{flex:1;background:var(--bg);border-radius:14px;padding:8px;text-align:center;font-size:13px;color:var(--mute)}
.tot b{display:block;font-size:22px;color:var(--accent)}
.jump{display:flex;gap:8px;align-items:center}
.jump input{flex:1;height:46px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:0 10px;font-size:17px;color:var(--ink)}
/* ספרים */
.sec{font-size:17px;font-weight:800;margin:22px 4px 8px;display:flex;align-items:center;gap:8px}
.sec:before{content:"";width:6px;height:20px;border-radius:3px;background:var(--cc)}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.pg button{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 6px;font-weight:700;font-size:15px;line-height:1.25}
.pg button small{display:block;font-weight:500;font-size:11.5px;color:var(--mute);margin-top:2px}
.pg button.cur{border:2px solid var(--gold);background:var(--mark)}
/* קריאה */
.rsub{text-align:center;margin:12px 0 2px;color:var(--mute);font-size:14px}
.rsub b{display:block;color:var(--accent);font-size:19px}
.text{margin-top:6px}
.chh{display:flex;align-items:center;gap:10px;color:var(--c2);font-family:"UIFont",system-ui,sans-serif;font-weight:800;font-size:15px;margin:18px 0 6px}
.chh:before,.chh:after{content:"";flex:1;height:1px;background:var(--line)}
.vs{margin:4px 0 6px}
.mk{line-height:2.1}
.vnum{font-family:"UIFont",system-ui,sans-serif;font-size:.46em;color:var(--accent);border:1px solid var(--line);border-radius:8px;padding:3px 8px;margin-inline-end:8px;vertical-align:middle;background:var(--card);white-space:nowrap}
.tg{font-size:calc(var(--fs)*.86);line-height:1.95;background:var(--tg);border-inline-start:5px solid var(--tgb);border-radius:10px;padding:6px 12px;margin:2px 0 4px}
.tg i{font-style:normal;font-family:"UIFont",system-ui,sans-serif;font-size:.5em;font-weight:800;color:var(--tgb);margin-inline-end:8px;letter-spacing:.3px;vertical-align:middle}
.pbr{height:.7em}
.rh .rt small{display:block;font-weight:600;font-size:12px;opacity:.85}
.logo{display:inline-block;background:#fff;border-radius:18px;padding:8px 14px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.logo img{display:block;height:72px;width:auto}
.cmn{font-size:14px;color:var(--mute);text-align:center;margin:6px 0;font-family:"UIFont",system-ui,sans-serif}
:root{--bmc:#9b2c3d;--bmbg:rgba(155,44,61,.10);--bmflash:rgba(155,44,61,.32)}
[data-theme=dark]{--bmc:#e57a8e;--bmbg:rgba(229,122,142,.14);--bmflash:rgba(229,122,142,.38)}
[data-theme=sepia]{--bmc:#8a2c1d;--bmbg:rgba(138,44,29,.12);--bmflash:rgba(138,44,29,.34)}
button.vnum{cursor:pointer}
.vnum svg{width:1.1em;height:1.1em;vertical-align:-.18em;margin-inline-start:5px}
.vnum.on{background:var(--bmc);border-color:var(--bmc);color:#fff}
.vnum.on svg{fill:currentColor}
.vs{border-radius:8px;transition:background .3s}
.vs.bm{background:var(--bmbg)}
.vs.pulse{animation:bmpulse .9s ease-in-out 3}
@keyframes bmpulse{0%,100%{background:var(--bmbg)}50%{background:var(--bmflash)}}
.bmline{display:flex;align-items:center;gap:10px;margin:8px 0 14px;color:var(--bmc);font-family:"UIFont",system-ui,sans-serif;font-size:16px;font-weight:800;line-height:1.2}
.bmline:before,.bmline:after{content:"";flex:1;height:2px;background:var(--bmc);opacity:.85}
.bmline button{border:1px solid var(--bmc);background:transparent;color:var(--bmc);border-radius:999px;font-size:12px;font-weight:700;padding:3px 10px}
.hint{display:flex;align-items:center;gap:12px;background:var(--card);border:2px dashed var(--bmc);border-radius:16px;padding:12px 14px;margin:10px 0 4px;font-family:"UIFont",system-ui,sans-serif;font-size:15px;line-height:1.5}
.hint b{color:var(--bmc)}
.hint button{border:0;background:var(--bmc);color:#fff;border-radius:10px;padding:9px 14px;font-weight:700;white-space:nowrap}
.bmcard{display:flex;flex-wrap:wrap;align-items:center;gap:14px;background:linear-gradient(135deg,var(--card),var(--bmbg));border:2px solid var(--bmc);padding:14px}
.bmcard .ico{width:46px;height:46px;border-radius:50%;background:var(--bmc);color:#fff;display:grid;place-items:center;flex:none}
.bmcard .ico svg{width:24px;height:24px;fill:currentColor}
.bmcard .tx{flex:1;min-width:0}
.bmcard .tx small{color:var(--bmc);font-weight:800;font-size:13px}
.bmcard .tx b{display:block;font-size:19px}
.bmcard .tx span{display:block;font-size:15px;color:var(--mute)}
.bmcard .go{border:0;background:var(--bmc);color:#fff;border-radius:12px;padding:13px 14px;font-weight:800;font-size:17px;width:100%}

  else if (D.r) {
    const [k, x, a] = D.r.split(":"), r = k === "w" ? { v: "read", w: x, a: +a } : { v: "read", p: +x, a: +a };
    if (t.hasAttribute("data-resume") && S.bm) {                       // ממשיכים ללמוד - הסימניה הישנה כבר לא נחוצה
      lastBm = S.bm; r.resume = S.bm; S.bm = null; save(); toast("הסימניה הוסרה - מתקדמים הלאה", "ביטול");
    }
    go(r);
  }
  else if (D.toggle) { const [w, a] = D.toggle.split(":"); toggleDone(w, +a); }
  else if (D.sunset != null) { S.sunset = D.sunset === "1"; save(); checkDayRoll(); toast(S.sunset ? "היום מתחלף בשקיעה" : "היום מתחלף בחצות"); route.keep = true; render(); }
  else if (D.day) go({ v: "day", date: D.day });
  else if (D.week) {
    const nd = addDays(parseISO(route.date), 7 * +D.week);
    if (!SCH[shabOf(nd)]) return toast("אין נתוני לוח לשבוע הזה");
    go({ v: "day", date: iso(nd) });
  }
  else if (t.hasAttribute("data-today")) go({ v: "day", date: iso(today()) });
  else if (t.hasAttribute("data-next") || t.hasAttribute("data-prev")) {
    const a = route.a + (t.hasAttribute("data-next") ? 1 : -1); if (a < 0 || a > 6) return;
    go(Object.assign({}, route, { a, keep: false, resume: null }), true);
  }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeSheet();
  if ((e.key === "Enter" || e.key === " ") && e.target.getAttribute && e.target.getAttribute("role") === "button") { e.preventDefault(); e.target.click(); }
});
window.addEventListener("online", () => { for (const k in rsFail) delete rsFail[k]; rsToasted = false; if (route.v === "read") { route.keep = true; render(); } });
/* ---------- גיבוי ושחזור ---------- */
const bkData = () => ({ app: "shnayim-mikra", v: 1, done: S.done, pd: S.pd, bm: S.bm });
const toCode = o => { const b = new TextEncoder().encode(JSON.stringify(o)); let s = ""; for (let i = 0; i < b.length; i += 8192) s += String.fromCharCode.apply(null, b.subarray(i, i + 8192)); return btoa(s); };
const fromCode = c => JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(c), ch => ch.charCodeAt(0))));
function applyBackup(o) {
  if (!o || o.app !== "shnayim-mikra" || !o.done || typeof o.done !== "object" || Array.isArray(o.done)) throw 0;
  for (const k of Object.keys(o.done)) if (/^\d{4}-\d\d-\d\d:[0-6]$/.test(k) && k.slice(0, 10) in SCH) S.done[k] = 1;
  if (o.pd && typeof o.pd === "object" && !Array.isArray(o.pd)) for (const k of Object.keys(o.pd)) if (/^\d+$/.test(k) && P[+k]) S.pd[k] = 1;
  if (o.bm && !S.bm) { S.bm = o.bm; validateBm(); }
  save(); toast("הגיבוי שוחזר ✓"); route.keep = true; render();
}
function backup(kind) {
  if (kind === "copy") {
    const c = toCode(bkData());
    (navigator.clipboard ? navigator.clipboard.writeText(c).then(() => toast("הקוד הועתק - שמור אותו במקום בטוח")) : Promise.reject()).catch(() => prompt("העתק את הקוד ושמור אותו:", c));
  } else if (kind === "file") {
    const json = JSON.stringify(bkData()), name = "shnayim-mikra-backup-" + iso(today()) + ".json";
    const f = typeof File === "function" ? new File([json], name, { type: "application/json" }) : null;
    if (f && navigator.canShare && navigator.canShare({ files: [f] })) { navigator.share({ files: [f] }).catch(() => {}); return; }
    const url = URL.createObjectURL(new Blob([json], { type: "application/json" }));
    const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  } else if (kind === "restore") {
    const c = prompt("הדבק כאן את קוד הגיבוי:"); if (!c) return;
    try { applyBackup(fromCode(c.trim())); } catch (e) { toast("הקוד לא תקין"); }
  } else if (kind === "load") $("#bkf").click();
}
document.addEventListener("change", e => {
  const nv = e.target.dataset && e.target.dataset.nav;
  if (nv === "book") { navBook = e.target.value; route.keep = true; render(); return; }
  if (nv === "par") { if (e.target.value !== "") go({ v: "par", p: +e.target.value }); return; }
  if (e.target.id === "bkf" && e.target.files[0]) { const r = new FileReader(); r.onload = () => { try { applyBackup(JSON.parse(r.result)); } catch (x) { toast("הקובץ לא תקין"); } }; r.readAsText(e.target.files[0]); e.target.value = ""; return; }
  if (e.target.id === "jd") {
    const v = e.target.value; if (!/^\d{4}-\d\d-\d\d$/.test(v)) return;
    if (!SCH[shabOf(parseISO(v))]) return toast("אין נתוני לוח לתאריך הזה");
    go({ v: "day", date: v });
  }
});
let shownToday = iso(today());
function checkDayRoll() {                                            // עבר יום (או שקיעה) בזמן שהאפליקציה פתוחה
  const t = iso(today()); if (t === shownToday) return;
  const wasToday = route.v === "day" && route.date === shownToday; shownToday = t;
  if (wasToday) go({ v: "day", date: t }, true); else if (route.v === "day") { route.keep = true; render(); }
}
let hiddenAt = 0;
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden") { hiddenAt = Date.now(); return; }
  if (hiddenAt && Date.now() - hiddenAt > 3 * 3600e3 && route.v === "day" && route.date !== iso(today())) go({ v: "day", date: iso(today()) }, true);
  checkDayRoll();
});
window.addEventListener("pageshow", checkDayRoll); window.addEventListener("focus", checkDayRoll);
setInterval(checkDayRoll, 30000);
fromHash();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(err => console.error("SW registration failed:", err));
